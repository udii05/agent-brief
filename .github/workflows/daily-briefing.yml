name: Daily AI Briefing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python main.py

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: briefing.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node deps
        run: |
          cd whatsapp
          npm install

      - name: Restore WhatsApp session cache
        id: whatsapp-cache
        uses: actions/cache@v4
        with:
          path: whatsapp/session
          key: whatsapp-session-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-

      - name: Send via WhatsApp
        id: send-whatsapp
        env:
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          TO_NUMBER: ${{ secrets.TO_NUMBER }}
        run: |
          cd whatsapp
          node index.js 2>&1 | tee ../whatsapp-send.log

      - name: Save updated session for next run
        if: always()
        shell: bash
        run: |
          cd whatsapp
          if [ -d session ]; then
            tar czf ../session.tar.gz session/
            echo "session_size=$(du -sh session | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: session/ directory missing" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload session artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-session
          path: session.tar.gz
          retention-days: 7
          overwrite: true

      - name: Show WhatsApp send log
        if: always()
        run: cat whatsapp-send.log 2>/dev/null || echo "(no log)"

      - name: Upload send log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-send-log
          path: whatsapp-send.log
          retention-days: 7
